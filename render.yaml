services:
  - type: web
    name: laxalab-api-public
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/src/main.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DENY_ADMIN_AUD
        value: "1"
      - key: REQUIRE_OBJECT_STORAGE
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: laxalab-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: laxalab-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        value: https://laxalab-api-public.onrender.com/auth/google/callback
      - key: FRONTEND_URL
        value: https://laxalab-web-learner.onrender.com
      - key: CORS_ORIGINS
        value: https://laxalab.com,https://www.laxalab.com
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.05"
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false

  - type: web
    name: laxalab-api-admin
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/src/main.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_SURFACE
        value: "1"
      - key: REQUIRE_OBJECT_STORAGE
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: laxalab-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: laxalab-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://m.o2.h.laxalab.com
      - key: CORS_ORIGINS
        value: https://m.o2.h.laxalab.com
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.05"
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false

  - type: web
    name: laxalab-web-learner
    runtime: node
    plan: free
    region: frankfurt
    rootDir: frontend
    buildCommand: npm ci --include=dev && npm run build && mkdir -p .next/standalone/frontend/.next && cp -R .next/static .next/standalone/frontend/.next/static && cp -R public .next/standalone/frontend/public
    startCommand: HOSTNAME=0.0.0.0 node .next/standalone/frontend/server.js
    healthCheckPath: /ar
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_MODE
        value: learner
      - key: NEXT_PUBLIC_API_URL
        value: https://laxalab-api-public.onrender.com
      - key: NEXT_PUBLIC_SITE_URL
        value: https://laxalab-web-learner.onrender.com
      - key: NEXT_PUBLIC_GA4_ID
        sync: false
      - key: NEXT_PUBLIC_SENTRY_DSN
        sync: false
      - key: NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE
        value: "0.05"
      - key: SENTRY_AUTH_TOKEN
        sync: false
      - key: SENTRY_ORG
        sync: false
      - key: SENTRY_PROJECT
        sync: false

  - type: web
    name: laxalab-web-admin
    runtime: node
    plan: free
    region: frankfurt
    rootDir: frontend
    buildCommand: npm ci --include=dev && npm run build && mkdir -p .next/standalone/frontend/.next && cp -R .next/static .next/standalone/frontend/.next/static && cp -R public .next/standalone/frontend/public
    startCommand: HOSTNAME=0.0.0.0 node .next/standalone/frontend/server.js
    healthCheckPath: /ar
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_MODE
        value: admin
      - key: NEXT_PUBLIC_API_URL
        value: https://laxalab-api-admin.onrender.com
      - key: NEXT_PUBLIC_SITE_URL
        value: https://m.o2.h.laxalab.com
      - key: NEXT_PUBLIC_SENTRY_DSN
        sync: false
      - key: NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE
        value: "0.05"
      - key: SENTRY_AUTH_TOKEN
        sync: false
      - key: SENTRY_ORG
        sync: false
      - key: SENTRY_PROJECT
        sync: false

  - type: keyvalue
    name: laxalab-redis
    plan: free
    region: frankfurt
    ipAllowList: []

databases:
  - name: laxalab-postgres
    databaseName: laxalab
    user: laxalab
    plan: free
    region: frankfurt
    ipAllowList: []
